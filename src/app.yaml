command:
  - sh
  - -c
  - uvicorn app:app --host 0.0.0.0 --port ${DATABRICKS_APP_PORT:-8080}

env:
  # Inject the JEV API key from a Databricks secret. Create the secret first:
  #   databricks secrets create-scope jev
  #   databricks secrets put-secret jev api_key
  # then reference it here. NEVER hardcode the key.
  - name: JEV_API_KEY
    valueFrom: jev-api-key
  # Optional: log routing decisions to the app's stdout.
  - name: JEV_LOG_PROMPT
    value: "1"
